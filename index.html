<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de pedidos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <h1>👕 Control de pedidos</h1>
    <div class="acciones">
      <label>Margen del negocio %
        <input type="number" id="margen" min="0" step="1" value="30">
      </label>
      <button id="btnExportar" class="sec">Exportar copia</button>
      <label class="btn sec">Importar<input type="file" id="fileImportar" accept=".json" hidden></label>
    </div>
  </header>

  <main>
    <section class="resumen" id="resumen"></section>

    <section class="card">
      <h2 id="tituloForm">Nuevo pedido</h2>
      <form id="form" autocomplete="off">
        <input type="hidden" id="id">
        <label>Fecha <input type="date" id="fecha" required></label>
        <label>Tipo
          <select id="tipo">
            <option>Remera</option><option>Chomba</option><option>Tela</option><option>Otro</option>
          </select>
        </label>
        <label>Color <input type="text" id="color" placeholder="Negro, blanco..."></label>
        <label>Cantidad <input type="number" id="cantidad" min="1" step="any" value="1" required></label>
        <label>Comprado en <input type="text" id="lugar" placeholder="Dónde compraste"></label>
        <label>Para quién <input type="text" id="cliente" placeholder="Cliente"></label>
        <label>Estado
          <select id="estado">
            <option value="pedido">Pedido (sin hacer)</option>
            <option value="falta">Falta entregar</option>
            <option value="entregado">Entregado</option>
          </select>
        </label>
        <label>Diseño
          <select id="diseno">
            <option>Ninguno</option><option>DTF</option><option>Sublimación</option>
          </select>
        </label>
        <label>Costo prenda (c/u) <input type="number" id="costoPrenda" min="0" step="any" value="0"></label>
        <label>Costo diseño (c/u) <input type="number" id="costoDiseno" min="0" step="any" value="0"></label>
        <label>Total cobrado <input type="number" id="cobrado" min="0" step="any" value="0"></label>
        <label class="ancho">Notas <input type="text" id="notas"></label>

        <div class="calc" id="calcVivo"></div>

        <div class="botones">
          <button type="submit" id="btnGuardar">Guardar</button>
          <button type="button" id="btnCancelar" class="sec" hidden>Cancelar edición</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="filtros">
        <label>Mes <select id="fMes"></select></label>
        <label>Estado
          <select id="fEstado">
            <option value="">Todos</option>
            <option value="pedido">Pedido (sin hacer)</option>
            <option value="falta">Falta entregar</option>
            <option value="entregado">Entregado</option>
          </select>
        </label>
        <label>Buscar <input type="search" id="fBuscar" placeholder="Cliente, color, lugar..."></label>
      </div>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha</th><th>Tipo</th><th>Color</th><th>Cant.</th><th>Comprado en</th>
              <th>Para</th><th>Diseño</th><th>Estado</th><th>Costo total</th>
              <th>Sugerido</th><th>Cobrado</th><th>Ganancia</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/calculos.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
